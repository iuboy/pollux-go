name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: Test (race, integration)
        # Integration tests requiring the Tongsuo binary t.Skip on CI; the rest
        # (real sockets, cross-package flows) still run. -race on every test.
        run: go test -race -tags=integration ./...

  lint:
    name: Lint & Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        # Cheapest check first: fail fast on formatting drift. The vendored
        # quic-go/ fork is excluded (upstream code, PATCHES.md), matching the
        # gosec/staticcheck exclusions below. `gofmt -l` lists files needing
        # formatting; the grep leaves a clean (exit 1 → no output → empty diff)
        # state when everything is already formatted.
        run: |
          if diff="$(gofmt -l . | grep -v '^quic-go/')"; then
            echo "gofmt drift in:"; echo "$diff"; exit 1
          fi
      - name: gosec
        # Excludes mirror Makefile GOSEC_EXCLUDE — rules reviewed as safe for a
        # GM stack (see Makefile header for the per-rule rationale). The
        # vendored quic-go/ fork is excluded (upstream code, PATCHES.md) —
        # same exclusion staticcheck applies below, since gosec flags the
        # upstream unsafe calls (G103) in quic-go's Linux socket helpers
        # that we cannot change.
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go list ./... | grep -v '/quic-go' | xargs gosec -exclude G104,G115,G304,G401,G402,G405,G501,G502,G505 -quiet
      - name: staticcheck
        # CI runs only the SA (correctness) checks. ST (style) checks are
        # skipped: protocol identifiers like TLS_SM4_GCM_SM3 / SuiteECDHE_SM2_*
        # intentionally mirror their RFC 8998 / GB/T 38636 standard names.
        # SA1019 is excluded because SM2 is a non-NIST curve unsupported by
        # crypto/ecdh, making the flagged elliptic/ecdsa APIs unavoidable. The
        # vendored quic-go/ fork is excluded (upstream code, PATCHES.md).
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go list ./... | grep -v '/quic-go' | xargs staticcheck -checks 'SA*,-SA1019'
      - name: golangci-lint
        # Broader best-practice surface (errcheck, revive, gocritic, errorlint,
        # nilerr, ...) configured in .golangci.yml at the repo root. This job is
        # also the ONLY gate for SA1019 (deprecated APIs): the standalone
        # staticcheck step above disables it repo-wide, while here it is enabled
        # with path-scoped exclusions (sm2/ raw-SM2 point math forces
        # crypto/elliptic + ecdsa.X/Y/D; test files construct keys via the
        # deprecated fields on purpose). Other exclusions carry their rationale
        # in the config (cipher-suite naming mirrors the GB/T 38636 standard
        # designations; the vendored quic-go/ fork is upstream code). This job
        # exists because the security review found real defects (swallowed
        # errors, dead branches) that none of the above steps could catch.
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          golangci-lint run --timeout 5m ./...
